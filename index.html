<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歷史觀測站 - 關鍵抉擇</title>

<style>
        /* --- 1. 整體背景與字體 --- */
        body {
            /* 網頁最底層的背景顏色 (現在是深灰色 #1a1a1a) */
            background: #1a1a1a; 
            /* 全局文字顏色 (現在是淺灰色 #e0e0e0) */
            color: #e0e0e0; 
            /* 全局字體設定 (建議保留 Segoe UI, JhengHei 是微軟正黑體) */
            font-family: 'Segoe UI', 'Microsoft JhengHei', Tahoma, sans-serif; 
            
            /* 以下保留，負責置中 */
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0;
            padding: 18px 0; 
            box-sizing: border-box; /* 確保 padding 不會撐破總寬度 */
            overflow-x: hidden;    /* 防止左右出現討厭的捲軸 */
        }

        /* --- 2. 遊戲主對話框 (框架) --- */
        #game-board {
            /* 框架的寬度 (現在是 90%，最大 600px) */
            width: 80%; 
            max-width: 600px;
            margin: 0 auto;  /* 確保在視窗縮小時，它還能盡量維持在中間 */ 
            
            /* 框架的背景顏色 (現在是較淺的深灰 #2d2d2d) */
            background: #2d2d2d; 
            /* 框架邊框：粗細 樣式 顏色 (現在是 2px 實線 灰色 #4a4a4a) */
            border: 6px solid #4a4a4a; 
            /* 框架圓角 (數值越大越圓) */
            border-radius: 10px; 
            
            /* 框架陰影：水平 垂直 模糊 顏色 (現在是黑色 0.5 透明度) */
            box-shadow: 0 0 30px rgba(0,0,0,0.5); 
            
            /* 以下保留 */
            position: relative; 
            padding: 20px; 
        }

        /* --- 3. 頂部狀態列 (位置與穩定值) --- */
        .stats {
            display: flex; 
            flex-direction: column;   /* 強制換行 */
            align-items: flex-start;  /* 強制靠左 */
            justify-content: flex-start;
            width: 100%;             /* 佔滿寬度 */
            text-align: left;        /* 文字對齊靠左 */
            margin-bottom: 20px; 
            border-bottom: 3px solid #4a4a4a; 
            padding-bottom: 12px; 
            color: #81c784; 
            font-weight: bold; 
            font-size: 1.1rem; 
            gap: 5px;                /* 兩行文字的間距 */
        }

        /* --- 4. 核心對話文本區 --- */
        #dialog-box {
            /* 對話框的最小高度，確保文字變多時不會亂跳 */
            min-height: 160px; 
            
            /* ⭐字體大小 (現在是 1.1rem，約 17.6px)⭐ */
            /* 妳可以改成 1.2rem 或 1.3rem 讓字變大 */
            font-size: 1.2rem; 
            
            /* 行高 (決定段落間距，建議 1.6-1.8 閱讀最舒服) */
            line-height: 1.6; 
            margin-bottom: 36px; 
        }

        /* --- 5. 選項按鈕 (基本樣式) --- */
        .option-btn {
         	/* 按鈕背景顏色 */
            background: #3F3F3F; 
            
           	/* 按鈕邊框 */
            border: 2px solid #555; 
            
            /* 按鈕文字顏色 */
            color: #fff; 
            
           	/* 按鈕內距 (上下 左右) */
            padding: 10px 16px; 
            margin-bottom: 8px; 
            width: 100%; 
            text-align: left; 
            cursor: pointer; 
            
       	    /* 按鈕圓角 */
            border-radius: 8px; 
            
           	 /* 按鈕字體大小 (預設通常繼承 body)⭐ */
           	 /* 加上這行來單獨控制按鈕字體： font-size: 1rem; */
            font-size: 1.2rem;            

         	  /* 以下保留，負責動畫效果 */
            transition: all 0.2s;
            min-height: 60px; /*<--確保高度緊湊*/
        }

            /* --- 專屬按鈕標籤 (Tag) 樣式 --- */
        .btn-tag {
            display: inline-block; /* 讓標籤可以有自己的內距 */
            background: #0a3030;   /* 標籤背景色(呼應妳的 hover 設定) */
            color: #FFFFFF;        /* 標籤文字顏色 */
            padding: 1px 8px;     /* 上下 1px，左右 8px 的空間 */
            border-radius: 8px;   /* 圓角，讓它看起來像個小藥丸 */
            font-size: 0.8rem;     /* 字體稍微小一點點，區分主文 */
            font-weight:normal ;     /* 字體加粗可改bold */
            margin-bottom: 4px;    /* 和下方的文字拉開一點距離 */
            border: 2px solid #006666; /* 加上淡淡的邊框 */
            letter-spacing: 1px;   /* 字距稍微拉開一點點 */
        }

        /* --- 6. 選項按鈕 (滑鼠滑過時的樣式) --- */
        .option-btn:hover {
            /* 滑過時的背景顏色 (現在是亮綠色 #4caf50) */
            background: #007979; 
            
            /* 滑過時的邊框顏色 */
            border-color: #80FFFF; 
            
            /* 滑過時向右位移的動畫 */
            transform: translateX(5px); 
        }

        /* --- 7. 警告文字 --- */
         .alert {
   	        color: #ff5252;
 	        font-weight: bold;
 	        margin-top: 10px;
 	        display: none;
	    }

        /* --- 8. 最終結算區 (確保 display: none 正常運作) --- */
        #final-score {
   	        text-align: center;
            display: none; 
  	        margin-top: 20px;
  	        padding: 20px;
            background:rgba(44, 44, 44, 0.2); /* 加一點深色背景，讓結算感更重 */
            border-radius: 8px;
        }
        
        /* --- 9. 版權宣告 --- */
        .credits {
            position: absolute; /* 絕對定位 */
            bottom: 6px;      /* 距離底部 8 像素 */
            right: 15px;       /* 距離右邊 15 像素 */
            font-size: 14px;   /* 小字體 */
            color: rgba(255, 255, 255, 0.4); /* 淡淡的半透明白色 */
            text-align: right;
            line-height: 1.5;
            pointer-events: none; /* 讓滑鼠點擊穿透，不會擋到按鈕 */
            font-family: sans-serif;
        }
        
        /* --- 10. 手機版 RWD 調整 --- */
        @media (max-width: 600px) {
            body {
                min-height: 100vh;  /* 至少佔滿螢幕 */
                height: auto;       /* 內容超過時自動長高，不會把按鈕擠出框外 */
                display: flex;
                flex-direction: column;
                justify-content: center; /* 電腦版維持置中 */
                align-items: center;
                padding: 14px 0;    /* 給手機版一點上下留白 */
                box-sizing: border-box;
                overflow-x: hidden;    /* 防止左右出現討厭的捲軸 */
            }

            #game-board {
                width: 85%; 
                min-height: auto; 
                margin-top: 10px;
                margin-bottom: 10px;
                padding-bottom: 40px; /* 給最下面的版權文字留點空間 */
            }

            /* 2. 狀態列強制垂直且靠左 */
            .stats {
                display: flex !important;
                flex-direction: column !important; /* 強制變直視窗排列 */
                align-items: flex-start !important; /* 絕對靠左 */
                text-align: left !important;
                width: 100% !important;
                margin-bottom: 15px; 
                padding-bottom: 8px;
                gap: 3px;
            }

            /* 3. 確保狀態列裡面的文字也是靠左 */
            .stats span, .stats div {
                text-align: left !important;
                margin-left: 0 !important;
            }

            /* 4. 選項按鈕美化：讓手在大拇指範圍內好點擊 */
            .option-btn {
                text-align: center; /* 按鈕文字在手機上置中比較好看 */
                padding: 12px 10px; /* 👈 原本可能是 15px 或 18px，縮小一點 */
                min-height: 50px;   /* 👈 稍微降低最小高度限制 */
                margin-bottom: 10px;
                font-size: 1rem;    /* 字體稍微縮小一點點，平衡視覺 */
            }

            .btn-tag {
                font-size: 0.75rem; /* 標籤也同步縮小一點點 */
                margin-bottom: 2px;
            }

            /* 署名 */
            .credits {
                font-size: 8px;
                bottom: 5px;
                right: 10px;
            }
        } /* <--- 這是整個手機版設定唯一的結尾括號 */

</style>

</head>
<body>

<div id="game-board">
    <div id="login-screen" style="text-align: center; padding: 20px 0;">
        <h2 style="color: #81c784; margin-bottom: 20px;">歷史觀測站 - 關鍵抉擇</h2>
        <p>請輸入妳的代號或名稱：</p>
        <input type="text" id="player-name-input" placeholder="例如：Xizuku" 
               style="padding: 8px; font-size: 1.1rem; border-radius: 8px; border: 2px solid #555; background: #3F3F3F; color: #fff; margin-bottom: 30px; width: 80%; max-width: 250px; text-align: center;">
        <br>
        <button class="option-btn" onclick="initGame()" style="text-align: center; width: 80%; max-width: 200px;">進入時空觀測站</button>
    </div>
    <div id="game-ui" style="display: none;">
        <div class="stats">
            <span>👤 觀測員：<span id="player-name-display" style="color: #fff;"></span></span>
            <span>📍 目前位置：<span id="loc">時空傳送中</span></span>
            <span>⌛ 歷史穩定值：<span id="stability">100</span>%</span>
        </div>
        
        <div id="main-content">
            <div id="dialog-box">正在連線至歷史資料庫......</div>
            <div id="options-container"></div>
        </div>
    </div>

    <div id="final-score" style="display: none;"> <h2>觀測結束</h2>
        <div id="score-text"></div>
        <button class="option-btn" onclick="returnToHub()" style="text-align:center; background: #007979;">🚀 回到觀測站</button>
        <button class="option-btn" onclick="location.reload()" style="text-align:center; background: #555; font-size: 1rem; min-height: 30px; margin-top: 15px;">切換觀測員 (重新登入)</button>
    </div>
    <div class="credits">
        2026.04.16　Created by Xizuku
    </div>
</div>

<script>
            // ⭐ 劇本總清單：以後新劇本只要加在這裡，程式會自動按年份排好！
    const scenarioList = [
        { year: 208,  title: "三國時代 - 赤壁大戰", node: "three_kingdoms_1" },
        { year: 353,  title: "魏晉風流 - 蘭亭雅集", node: "jin_1" },
        { year: 751,  title: "怛羅斯之戰 - 造紙技術西傳", node: "tang_1" },
        { year: 1000, title: "北宋汴京 - 商業革命", node: "song_1" },
        { year: 1271, title: "馬可波羅 - 東方見聞錄", node: "marco_polo_1" },
        { year: 1624, title: "熱蘭遮城 - 大航海時代", node: "taiwan_1" },
        { year: 1860, title: "清領府城 - 糖業與貿易", node: "taiwan_sugar" },
        { year: 1932, title: "昭和台南 - 銀座林百貨", node: "japanese_showa" },
        { year: 1945, title: "二戰終局 - 戰後台灣", node: "post_war_1" }
    ];
    // ⭐ 自動按年份排序（從小到大）
    scenarioList.sort((a, b) => a.year - b.year);

    let stability = 100;
    let currentStep = 'start';

    function updateGame(node) {
        console.log("👉 目前進入節點：", node); // 追蹤 1
        // 1. 先從 scenarios 抓出目前的劇本內容
        const scenario = scenarios[node];
        if (!scenario) {
            console.error("找不到節點：", node);
            return;      // 安全檢查
        }

        // 2. 自動生成劇本按鈕
        if (node === 'start' || node === 'start_page_2') {
            const page = (node === 'start') ? 1 : 2;
            const itemsPerPage = 5; 
            const startIdx = (page - 1) * itemsPerPage;
            const endIdx = startIdx + itemsPerPage;
            const currentItems = scenarioList.slice(startIdx, endIdx);

            scenario.options = currentItems.map(item => ({
                text: `【西元 ${item.year} 年】\n${item.title}`,
                next: item.node
            }));

            if (scenarioList.length > endIdx && page === 1) {
                scenario.options.push({ text: "▶ 【前往下一個站台】\n觀測更多時空節點", next: "start_page_2" });
            }
            if (page === 2) {
                scenario.options.push({ text: "◀ 【返回第一站台】", next: "start" });
            }
        }
       
// 3. 特殊節點判斷：如果回到起點，就恢復血量
        if (node === 'start') {
            stability = 100;
            document.getElementById('stability').innerText = stability;
        }
// 3.5 如果是結束點，跳轉結算頁	
        if (node === 'end') {
            console.log("🏁 偵測到 end，準備啟動 showEnd()"); // 追蹤 3
            showEnd();
            return;
        }
         // 2.5 更新畫面基礎資訊 (先更新地點，showEnd 才能抓到正確的字)
            console.log("📝 準備更新文字...", scenario.loc); // 追蹤 2
            document.getElementById('loc').innerText = scenario.loc;
            let finalDisplayText = scenario.text
                .replace(/\${name}/g, playerName); 

            document.getElementById('dialog-box').innerText = finalDisplayText;
                        currentStep = node;
              
// 4. 生成按鈕
        const container = document.getElementById('options-container');
        container.innerHTML = '';

        scenario.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';

            // ⭐ 標籤化魔法在這裡 ⭐
            // 1. 抓取 【 】 裡面的文字，替換成帶有 btn-tag 樣式的 span 
            // 2. 將劇本裡的換行符號 \n 替換成 HTML 的換行標籤 <br>
            let formattedText = opt.text;

            if (node === 'start'|| node === 'start_page_2') {
                formattedText = formattedText
                    .replace(/【(.*?)】/g, '<span class="btn-tag">$1</span>')
                    .replace(/\n/g, '<br>');
            }else {
            // 其他劇情頁面，單純處理換行就好，不處理 【 】 標籤
                formattedText = formattedText.replace(/\n/g, '<br>');
            }
            // 注意：這裡從 innerText 改成了 innerHTML，這樣 HTML 標籤才會生效
            btn.innerHTML = formattedText; 

            // 👇 以下是補齊的點擊事件與收尾括號 👇
            btn.onclick = () => {
                if (opt.effect !== undefined) {
                    stability += opt.effect;
                    if (stability > 100) stability = 100;
                    document.getElementById('stability').innerText = stability;
                }
                if (stability <= 0) {
                    alert('歷史完全崩潰！觀測失敗......再來一次！');
                    location.reload();
                } else {
                    updateGame(opt.next);
                }
            };
            container.appendChild(btn);
        });
    }   //<----function updateGame的結尾括號

    function showEnd() {
        document.getElementById('main-content').style.display = 'none';
        const final = document.getElementById('final-score');
        final.style.display = 'block';

        // 取得目前畫面上顯示的「位置」文字（例如：熱蘭遮城、觀測完成）
        const lastLoc = document.getElementById('loc').innerText;
    
        let reviewText = "";
    
        // 根據畫面上最後出現的地點關鍵字來給評語
        if (lastLoc.includes("熱蘭遮城") || lastLoc.includes("大員")) {
            reviewText = "恭喜觀測員，妳對【大航海時代的台灣】有了深刻理解，成功守護了福爾摩沙的轉折點！";
        } else if (lastLoc.includes("馬可波羅") || lastLoc.includes("元朝")) {
            reviewText = "恭喜觀測員，妳見證了【東西方文明的碰撞】！\n忽必烈的金牌是妳最棒的紀念品！";
        } else if (lastLoc.includes("汴京")|| lastLoc.includes("北宋")) {
            reviewText = "恭喜觀測員，妳對【宋朝商業制度】有了深刻理解，知道「夜市」是從北宋這個朝代開始！";
        } else if (lastLoc.includes("怛羅斯") || lastLoc.includes("撒馬爾罕")) {
            reviewText = "恭喜觀測員，妳對【唐朝文明傳播】有了深刻理解，「造紙術西傳」的影響力由妳親手守護！";
        } else if (lastLoc.includes("府城")) {
            reviewText = "恭喜觀測員，妳對【清領府城】有了深刻理解，任務圓滿達成！";
        } else if (lastLoc.includes("林百貨") || lastLoc.includes("昭和")) {
            reviewText = "恭喜觀測員，妳體驗了【昭和台南】的摩登生活，在林百貨的流籠裡看見了時代的進步！";
        } else if (lastLoc.includes("三國") || lastLoc.includes("赤壁")) {
            reviewText = "恭喜觀測員，妳對【三國風雲】有了深刻理解，成功協助孔明借箭，保住了歷史的平衡！";
        } else if (lastLoc.includes("戰後") || lastLoc.includes("1945")) {
            reviewText = "恭喜觀測員，妳見證了【戰後台灣】的劇烈變遷，在動盪的年代守護了珍貴的歷史記憶。";
        } else if (lastLoc.includes("蘭亭") || lastLoc.includes("王羲之") || lastLoc.includes("曲水")) {
            reviewText = "恭喜觀測員，妳完美融入了【魏晉名士】的生活！不但保護了蠶繭紙，還跟王羲之對酒當歌。那份醉人的墨香已永遠留在妳的記憶中。";
        } else {
            reviewText = "恭喜觀測員，任務圓滿達成！妳已成功守護了時空的秩序。";
        }
        // 結算畫面觀測員換成輸入的名稱
        reviewText = reviewText.replace(/觀測員/, playerName);

        document.getElementById('score-text').innerHTML = `
            <p style="font-size: 1.5rem; color: #81c784;">歷史最終穩定值：${stability}%</p>
            <p>${reviewText}</p>
        `;
    }

    // ⭐ 新增這段：直接切換畫面回大廳的魔法
    function returnToHub() {
        // 1. 把結算畫面隱藏起來
        document.getElementById('final-score').style.display = 'none';
        
        // 2. 把遊戲主內容區重新顯示出來
        document.getElementById('main-content').style.display = 'block';
        
        // 3. 呼叫大廳節點 (妳原本在 updateGame 裡已經寫好回到 start 會自動補滿 100% 穩定值了，非常聰明！)
        updateGame('start');
    }

</script>
<script>
    // #region 遊戲主頁控制
    const scenarios = {
        'start': {
            loc: '時空觀測站 - 第一站台',
            text: '妳好，${name}時空觀測員，這裡是時空觀測站 - 第一站台。\n妳將進入歷史的關鍵節點，妳的目標是守護歷史的穩定度。\n請選擇妳要進入的時間點：',
            options: []
        },
        'start_page_2': {
            loc: '時空觀測站 - 第二站台',
            text: '${name}觀測員妳好，這裡是時空觀測站 - 第二站台。\n請選擇妳要進入的時間點：',
            options: []
        },
        'end': {
            loc: '時空觀測任務完成',
            text: '觀測結束！妳成功守護了歷史的穩定度。\n想再次開啟時空旅行嗎？',
            options: [
                { text: '重新回到第一站台', next: 'start' }
            ]
        },
    // #endregion
    
    /*----提醒自己，新增劇本時，需在上一個劇本最後的}後面加上","---*/
        // #region 【208三國赤壁之戰】
        'three_kingdoms_1': {
            loc: '西元 208 年 長江江畔',
            text: '妳來到三國時代的關鍵時刻。孫劉聯軍正對抗曹操的大軍，諸葛孔明正為了「箭不夠用」而發愁。\n身為觀測員，妳該如何協助孔明完成「草船借箭」？',
            options: [
                { text: '大霧之夜出動：利用江面上濃霧的掩護，靠近曹操水寨。', next: 'tk_step_2', effect: 0 },

        'jin_1': {
            loc: '會稽山陰 蘭亭',
            text: '妳來到山陰的蘭亭，此地「有崇山峻嶺，茂林修竹」。一群名士正沿著溪水而坐。\n妳看見王羲之正對著溪中一隻神態優雅的大白鵝出神，甚至忘了手旁的墨已經乾了。妳會？',

        'jin_fail_1': {
            loc: '歷史擾動',
            text: '白鵝受驚拍翅而去，王羲之嘆了口氣對妳說：「${name}觀測員，名士的靈感是很脆弱的！」',

        // 第二階段：曲水流觴

                { text: '無酒不歡：這酒真香！我不作詩，我直接乾了！', next: 'jin_fail_2', effect: -20 },
                { text: '吟誦詩句：以清風明月為題，吟出優美的詩句。', next: 'jin_step_3', effect: 0 } 
            ]

        'jin_fail_2': {
            loc: '歷史擾動',
            text: '妳不小心喝得太醉，差點栽進溪水裡，雅集的氣氛變得有些混亂。\n王羲之搖搖頭說：「${name}觀測員，淺酌即可，不可貪杯啊！」',

        if (inputName !== "") {
            playerName = inputName; // 如果有輸入，就替換成輸入的名字
        }
        
        // 把名字顯示到上方的狀態列
        document.getElementById('player-name-display').innerText = playerName;
        
        // 隱藏登入畫面，顯示遊戲主畫面
        document.getElementById('login-screen').style.display = 'none';
